name: Verificar módulos
on:
  push:
    branches: [main, Luis-modulos-remotos]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:coberturaModulos :app:coberturaLogica --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacion-android
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
