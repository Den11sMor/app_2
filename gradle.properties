
# Configuración general de Gradle.

# Memoria asignada a Gradle y codificación de caracteres.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Activa el modo paralelo solo si es necesario.
# org.gradle.parallel=true

# Activa la caché de configuración para mejorar el rendimiento.
org.gradle.configuration-cache=true

# Establece el estilo oficial de código Kotlin.
kotlin.code.style=official

# Compatibilidad temporal con Kotlin integrado y KSP.
android.disallowKotlinSourceSets=false
